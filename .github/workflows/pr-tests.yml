name: Tests

# Why this file exists
# --------------------
# Before it, nothing ran the Python suite on a pull request.
# daily-refresh.yml triggers on push-to-main / schedule / dispatch and has
# no test step at all; league-submissions.yml triggers on `issues`. So a PR
# could add thousands of lines of tests, be merged, and ship three broken
# features -- which is exactly what happened with #78. The tests were not
# wrong so much as never executed anywhere that could block a merge.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      # The prospect artifacts are gitignored (data/engine_v3/prospects_*.json),
      # so a fresh checkout has none and every test that reads one errors out.
      # Building them here is deliberate: it is the step that would have
      # caught #78. The build crashed on a None projection, which is why
      # prospects.html shipped empty and rookie_rankings.json 404ed -- and a
      # crash here fails the job instead of degrading a page silently.
      #
      # Both scripts read only committed data (data/historical_ncaa_football,
      # data/pfr, data/consensus, data/bridge). No network, no secrets.
      - name: Build the artifacts the tests assert against
        run: |
          python scripts/build_prospect_engine.py --log-level WARNING
          python scripts/build_prospects_v3.py --log-level WARNING

      # Each module in its own pytest process.
      #
      # The suite has cross-module import pollution: tests/conftest.py evicts
      # and re-imports dynasty.* to beat a system-wide editable install, and
      # in a single shared process that leaves modules from an earlier file
      # half-loaded. test_custom_domain, test_league and test_rookie_rankings
      # all pass alone and fail inside a full run, on main as well as here.
      # Per-module isolation makes a red result mean a real failure rather
      # than an ordering artefact.
      #
      # QUARANTINE is the set already failing on main as of 98d6b13, measured
      # module-by-module. It is technical debt, listed explicitly so it stays
      # visible and shrinks, and so that everything outside it is a genuine
      # gate. Reproduce any entry with:
      #     python -m pytest <path> -q
      - name: Run the suite
        run: |
          set -uo pipefail
          QUARANTINE="
          tests/test_managerscore.py
          tests/test_pfr_seasonal_scraper.py
          tests/test_v2_2_penalties.py
          tests/test_v2_3_4_superflex_only_and_daily_refresh.py
          tests/test_v3_0_pr6_site.py
          tests/test_v3_8_phil_feedback_overhaul.py
          "
          failed=""
          skipped=""
          for f in tests/test_*.py; do
            if echo "$QUARANTINE" | tr -d ' ' | grep -qx "$f"; then
              skipped="$skipped $f"
              continue
            fi
            echo "::group::$f"
            # `|| rc=$?` rather than a bare call followed by `rc=$?`.
            # GitHub runs this block as `bash -e {0}`, and `set -uo pipefail`
            # above does NOT clear -e. A bare `python -m pytest` that exits
            # non-zero therefore aborts the whole step immediately, before
            # `rc=$?` is ever read -- so the rc==5 tolerance below could
            # never run, and neither could the quarantine summary. Measured:
            # this job failed on its first green module set, exit code 5,
            # at tests/test_v1_2_fantasy_weighted_knn.py ("1 skipped").
            # Putting the call on the left of `||` makes it a tested
            # command, which -e ignores.
            rc=0
            python -m pytest "$f" -q || rc=$?
            # 5 == "no tests ran" (a module whose cases are all skipped,
            # e.g. test_v1_2_fantasy_weighted_knn). Not a failure.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          echo
          echo "quarantined (known red on main, not gating):"
          for f in $skipped; do echo "  - $f"; done
          if [ -n "$failed" ]; then
            echo
            echo "FAILED modules:"
            for f in $failed; do echo "  - $f"; done
            exit 1
          fi
          echo
          echo "All non-quarantined modules passed."
