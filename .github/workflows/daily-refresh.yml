name: Daily refresh and publish

# When does this workflow run?
on:
  # Every day at 11:00 UTC (6 AM Central / 4 AM Pacific)
  schedule:
    - cron: '0 11 * * *'
    # Second in-season pass: Tuesday 16:00 UTC (11 AM Central), after Monday
    # night football has settled and the cut-up channels have posted. The
    # reel is only as good as how fast it sees last night's game.
    - cron: '0 16 * * 2'
  # Also run when you push changes to main
  push:
    branches: [main]
  # And let you trigger it manually from the GitHub Actions tab
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages
# contents: write is needed by the "Retain KTC value history" step below,
# which commits a ~6 KB/day dated value file back to main. Everything else
# here only reads. If you would rather not grant write to this workflow, the
# alternative is to drop that step and lose point-in-time pricing on the
# Manager Score page -- see src/dynasty/ktc_history.py for why there is no
# third option that actually persists.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't run two of these at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The scrapers cache every fetched page under data/pfr_cache and
      # data/sr_cache and short-circuit on a cache hit. Those directories are
      # gitignored (~60 MB), so without this step every CI run starts cold and
      # re-scrapes the entire history from Pro Football Reference. Measured on
      # run 30819066222: 198 min wall time, 196 of it inside the PFR scraper,
      # 431 fetch exceptions, 42 min of pure backoff sleeping, and 127 Wayback
      # fallbacks - all of it re-fetching seasons that have not changed since
      # they were played.
      #
      # Rolling cache: the run-id key never hits, so every run saves a fresh
      # copy, while restore-keys pulls the newest previous one. Daily access
      # keeps it clear of the 7-day eviction window.
      #
      # data/cross_league/cache is the same idea for Sleeper: completed NFL
      # seasons never change, so their transactions and box scores are
      # fetched once and kept. It lives here rather than in git because it is
      # raw third-party data (~24 MB of verbatim Sleeper responses) and is
      # fully regenerable -- the SCORES persist in corpus.json, so an evicted
      # cache costs one slower crawl, never an indexed league. See .gitignore.
      - name: Restore scraped-page cache
        uses: actions/cache@v4
        with:
          path: |
            data/pfr_cache
            data/sr_cache
            data/cross_league/cache
          key: scrape-cache-${{ github.run_id }}
          restore-keys: |
            scrape-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # web.archive.org refuses every TCP connection from GitHub-hosted
      # runners (Errno 111). Run 30819066222 made 1,122 such attempts for
      # zero successful fetches and spent 196 minutes doing it. The scraper
      # now prefers live PFR and trips a circuit breaker on the archive, but
      # skipping it outright in CI avoids paying even the breaker's warm-up.
      # Unset this to let the archive be tried again (e.g. running locally).
      # Pro Football Reference returns HTTP 403 to GitHub-hosted runners.
      # Our User-Agent is honest and self-identifying, so this is an
      # IP-level block on datacenter ranges, not something to work around -
      # Sports Reference's terms do not permit scraping, and we are not
      # going to spoof a browser to evade a deliberate access control.
      #
      # Run 35597107333 (with the direct-first fix) proved it: 26 x 403
      # from PFR and Errno 111 from the archive, on exactly the marquee
      # players the site most needs - Mahomes, Josh Allen, Lamar, Hurts,
      # Herbert, Lawrence, Bijan, Gibbs, Amon-Ra St. Brown.
      #
      # The per-player Career Stats panel is the only consumer. It is
      # skipped here until it is rebuilt on nflverse data, which we already
      # download in this same job and which is published for exactly this
      # use. The builder already degrades gracefully, so player pages lose
      # one panel and nothing else.
      #
      # DFM_CORPUS_URL is the deployed corpus worker (docs/CORPUS-BACKEND.md).
      # When the repository variable CORPUS_URL is unset -- which is the case
      # until the owner creates the D1 database and deploys -- this resolves
      # to an empty string and the Manager Score page is built exactly as it
      # was before: the submit script is emitted but inert, and no index UI
      # is shown.
      #
      # DFM_ANALYTICS_TOKEN is the Cloudflare Web Analytics beacon token
      # (docs/ANALYTICS.md). Same unset-is-fine contract as CORPUS_URL: with
      # no CF_ANALYTICS_TOKEN secret on the repository this resolves to an
      # empty string, report._page emits no beacon markup at all, and the
      # site is byte-identical to a build with analytics off. The token is
      # a *write-only* beacon id -- it identifies which site a page view
      # belongs to and grants no access to the Cloudflare account -- but it
      # is still a secret, so it must never be echoed. This is the ONLY
      # step that needs it, because report._page is the only place that
      # renders HTML, and nothing after this step re-renders a page.
      #
      # DFM_ANALYTICS_PROVIDER is intentionally NOT set here: it defaults to
      # cloudflare. Set the repository variable ANALYTICS_PROVIDER to
      # 'plausible' or 'fathom' to switch, or to 'none' to keep the secret
      # in place while measuring nothing.
      - name: Run the model end-to-end
        env:
          PFR_DISABLE_WAYBACK: '1'
          DFM_SKIP_CAREER_STATS: '1'
          DFM_CORPUS_URL: ${{ vars.CORPUS_URL }}
          DFM_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          DFM_ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
        run: |
          python -m dynasty.launcher_headless

      # Refresh the cross-league manager corpus.
      #
      # A BOUNDED crawl of Sleeper's social graph: Sleeper publishes no way to
      # enumerate leagues, so the only discovery path is league -> members ->
      # their leagues. Caps are explicit and conservative, and the run reports
      # the budget it consumed. Read docs/CROSS-LEAGUE-CORPUS.md before
      # raising any of these numbers -- Sleeper's API is free for
      # NON-COMMERCIAL use only, and the rate guidance is under 1000
      # calls/minute.
      #
      # Runs after the model build so it can overwrite the stale corpus copy
      # that generate_site() published into dynasty_site/ from the committed
      # artifact.
      #
      # continue-on-error: a Sleeper hiccup, a rate limit or a budget
      # exhaustion must never block the deploy. The page degrades to the last
      # committed corpus, or to "nothing indexed yet" if there is none.
      #
      # THE BUDGET, AND WHY IT IS SHAPED LIKE THIS
      #
      #   --max-calls 3000        hard ceiling on Sleeper calls for the run.
      #   --min-delay 0.15        floor on the gap between call starts. With
      #                           the harness's concurrency of 3 this paces
      #                           at most ~400 calls/minute, against
      #                           Sleeper's published guidance of under
      #                           1000/minute. Deliberately ~40% of the
      #                           limit: being a good citizen on a free,
      #                           unauthenticated, read-only API costs us
      #                           nothing but wall time.
      #   --max-seconds 1200      wall clock. 3000 throttled calls is ~12
      #                           minutes; this stops a stalled league from
      #                           holding the deploy open. The harness stops
      #                           between leagues AND mid-league on expiry,
      #                           discarding any partial read.
      #   --max-discovery-calls   discovery is cheap per call but unbounded
      #     300                   in breadth (every league fans out to ~12
      #                           users, every user to all their leagues).
      #                           Without a sub-cap a wide frontier eats the
      #                           whole budget before a league is scored.
      #   --max-discover 150      new dynasty leagues QUEUED per run. Not the
      #                           scoring cap: ~100 calls of discovery finds
      #                           hundreds of leagues, and they are worked
      #                           through over the following days.
      #   --max-leagues 40        leagues SCORED per run.
      #   --new-league-share 0.7  share of the scoring budget reserved for
      #                           leagues never scored before. This is the
      #                           setting that makes the corpus grow: the
      #                           first build spent its entire budget
      #                           re-reading the same five leagues and had
      #                           nothing left to find a sixth.
      #
      # Two committed artifacts make each run cheaper than the last:
      # data/cross_league/crawl_state.json (resume the walk instead of
      # repeating it) and data/cross_league/cache/ (completed seasons are
      # final, so they are fetched once and kept forever). Re-scoring an
      # indexed league costs only its live season. Measured on a real run:
      # 313 calls cold, 107 warm for the same four leagues.
      #
      # --update-seeds writes every confirmed dynasty league back into the
      # seed registry, so a lost or reset crawl state cannot cost coverage.
      - name: Refresh the cross-league manager corpus
        continue-on-error: true
        run: |
          python scripts/crawl_cross_league.py \
            --max-hops 2 \
            --max-leagues 40 \
            --max-discover 150 \
            --max-calls 3000 \
            --max-discovery-calls 300 \
            --max-seconds 1200 \
            --new-league-share 0.7 \
            --min-delay 0.15 \
            --max-cache-mb 256 \
            --update-seeds \
            --write-corpus \
            --site-out dynasty_site

      # Retain a compact dated KTC value record.
      #
      # The model build above runs scripts/refresh_ktc_consensus.py, which
      # writes data/consensus/history/ktc_values_YYYY-MM-DD.json (~6 KB). The
      # full dated snapshot written next to it is gitignored and dies with the
      # runner, which is why this project has never retained a single day of
      # KTC price history -- and why the Manager Score page currently has to
      # price eight-month-old trades at today's value and say so on the page.
      #
      # Committing the compact record is what fixes that, one day at a time.
      # It cannot be backfilled, so a skipped day is gone for good; the step
      # is continue-on-error because losing a day must never block the deploy.
      #
      # [skip ci] matters: this workflow triggers on push to main, so without
      # it every commit here would start another full run.
      - name: Retain KTC value history
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/consensus/history 2>/dev/null)" ]; then
            echo "No new KTC value history to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/consensus/history
          git commit -m "chore(ktc): retain dated value snapshot [skip ci]"
          # Another run (or a merge) may have landed first; rebase rather than
          # force anything, and give up quietly if it still will not apply.
          git pull --rebase --autostash origin main || exit 0
          git push origin HEAD:main

      # Retain the cross-league corpus.
      #
      # This is what makes the corpus GROW rather than churn. The site is
      # static on GitHub Pages, so a browser cannot write to the corpus --
      # committing it here is the only persistence mechanism available.
      #
      # Unlike the KTC history above, this CAN be rebuilt from scratch: a lost
      # day just means the next run re-crawls from the seeds. What is lost is
      # accumulated reach -- leagues found on earlier runs that today's budget
      # would not have reached.
      #
      # If this step cannot push (repository Actions permissions set to
      # read-only, branch protection), the feature still works: every run
      # crawls and ranks, and the page says "indexed in this build only"
      # instead of claiming a growing index. That degradation is by design and
      # covered by tests -- see docs/CROSS-LEAGUE-CORPUS.md section 7.
      #
      # `git add data/cross_league` now also picks up crawl_state.json -- the
      # frontier and scoring ledger that let tomorrow's run RESUME the walk
      # instead of repeating it. That file is what stopped the crawl being a
      # treadmill, so it has to survive the runner.
      #
      # data/cross_league/cache/ is gitignored and deliberately NOT committed
      # (raw third-party data, and regenerable); it is restored by the
      # actions/cache step at the top of this job instead.
      #
      # --max-cache-mb 256 bounds that Actions cache. A past league-season
      # costs ~63 KB gzipped (~235 KB raw; real transaction + matchup JSON
      # compresses 5.8x), so indexing the whole ~400-league queue lands near
      # 95 MB. Past the ceiling the crawl still runs and still SERVES
      # everything already cached -- it just stops banking new history.
      - name: Retain the cross-league corpus
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/cross_league 2>/dev/null)" ]; then
            echo "No cross-league corpus change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cross_league
          git commit -m "chore(crossleague): refresh manager corpus [skip ci]"
          git pull --rebase --autostash origin main || exit 0
          git push origin HEAD:main

      # Reconcile client-submitted leagues against an authoritative re-score.
      #
      # The corpus backend (scripts/cf-worker, docs/CORPUS-BACKEND.md) lets a
      # visitor's BROWSER submit a league it scored. Those submissions are
      # stored as 'provisional' and are NOT on the public board. This step is
      # the only thing that can promote them: it re-reads each pending league
      # from Sleeper, re-scores it with the same shipped page code, and tells
      # the worker whether the submitted numbers hold up.
      #
      # No-op unless the owner has deployed the backend -- the script exits 0
      # immediately when CORPUS_URL / CORPUS_RECONCILE_TOKEN are unset, so a
      # repo without D1 configured does not go red. continue-on-error for the
      # same reason the crawl above has it: a Sleeper hiccup must never block
      # the deploy.
      - name: Reconcile the cross-league corpus
        continue-on-error: true
        env:
          CORPUS_URL: ${{ vars.CORPUS_URL }}
          CORPUS_RECONCILE_TOKEN: ${{ secrets.CORPUS_RECONCILE_TOKEN }}
        run: |
          python scripts/reconcile_corpus.py \
            --limit 25 \
            --max-calls 600 \
            --min-delay-ms 250 \
            --values-dir dynasty_site

      # Must run AFTER the model build: it reads dynasty_site/engine_rankings.json
      # for model ranks and writes dynasty_site/highlights.json alongside it.
      # continue-on-error because a YouTube quota blip must never block the
      # rankings deploy — myteam.html and reel.html degrade to an on-page
      # message when the index is absent.
      - name: Refresh YouTube highlight index
        continue-on-error: true
        env:
          # Falls back to APIGOOGLESAND, the only secret currently on the
          # repo. If that one is actually the Maps key for another project,
          # the YouTube API answers 403, this step logs it and exits without
          # blocking the deploy - so the fallback is safe either way. Add a
          # secret literally named YOUTUBE_API_KEY and it wins automatically.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.APIGOOGLESAND }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY not set - skipping highlights refresh."
            exit 0
          fi
          # --gap-fill adds the targeted search.list layer for players the
          # curated channels missed. Budget note: search.list lives in its
          # OWN quota bucket of 100 calls/project/day (1 unit each) since
          # the 2026-06-01 granular-quota change - it does NOT draw on the
          # 10,000-unit pool the base layer uses, so an exhausted search
          # budget can no longer blank the reel.
          #
          # The default budget is 40 per run precisely because this
          # workflow can run twice on an in-season Tuesday (11:00 UTC
          # daily + 16:00 UTC Tuesday). 40 x 2 = 80 < 100, leaving 20
          # calls spare for a manual re-run.
          python scripts/refresh_highlights.py --gap-fill

      # Retain the permanent (player, season, week) search record.
      #
      # This is what makes gap-fill affordable rather than ruinous. A
      # player's week-N film does not change once week N is over, so a
      # search is bought once and reused forever - but only if the record
      # survives the runner, and the runner is ephemeral. Committing it is
      # the only persistence available to a static GitHub Pages site.
      #
      # Losing this file is not catastrophic but it IS expensive: every
      # (player, week) already answered would be re-asked, and with a hard
      # ceiling of 100 searches/day that is days of allowance to rebuild.
      # Misses matter as much as hits here - an empty result is a question
      # we already paid for.
      - name: Retain the highlight search cache
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/highlights/search_cache.json 2>/dev/null)" ]; then
            echo "No new highlight searches to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights/search_cache.json
          git commit -m "chore(highlights): retain gap-fill search cache [skip ci]"
          git pull --rebase --autostash origin main || exit 0
          git push origin HEAD:main

      - name: Upload site as a GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dynasty_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
