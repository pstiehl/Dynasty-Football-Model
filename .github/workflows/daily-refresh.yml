name: Daily refresh and publish

# When does this workflow run?
on:
  # Every day at 11:00 UTC (6 AM Central / 4 AM Pacific)
  schedule:
    - cron: '0 11 * * *'
    # Second in-season pass: Tuesday 16:00 UTC (11 AM Central), after Monday
    # night football has settled and the cut-up channels have posted. The
    # reel is only as good as how fast it sees last night's game.
    - cron: '0 16 * * 2'
  # Also run when you push changes to main
  push:
    branches: [main]
  # And let you trigger it manually from the GitHub Actions tab
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages
# contents: write is needed by the "Retain KTC value history" step below,
# which commits a ~6 KB/day dated value file back to main. Everything else
# here only reads. If you would rather not grant write to this workflow, the
# alternative is to drop that step and lose point-in-time pricing on the
# Manager Score page -- see src/dynasty/ktc_history.py for why there is no
# third option that actually persists.
permissions:
  contents: write
  pages: write
  id-token: write

# Don't run two of these at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The scrapers cache every fetched page under data/pfr_cache and
      # data/sr_cache and short-circuit on a cache hit. Those directories are
      # gitignored (~60 MB), so without this step every CI run starts cold and
      # re-scrapes the entire history from Pro Football Reference. Measured on
      # run 30819066222: 198 min wall time, 196 of it inside the PFR scraper,
      # 431 fetch exceptions, 42 min of pure backoff sleeping, and 127 Wayback
      # fallbacks - all of it re-fetching seasons that have not changed since
      # they were played.
      #
      # Rolling cache: the run-id key never hits, so every run saves a fresh
      # copy, while restore-keys pulls the newest previous one. Daily access
      # keeps it clear of the 7-day eviction window.
      - name: Restore scraped-page cache
        uses: actions/cache@v4
        with:
          path: |
            data/pfr_cache
            data/sr_cache
          key: scrape-cache-${{ github.run_id }}
          restore-keys: |
            scrape-cache-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # web.archive.org refuses every TCP connection from GitHub-hosted
      # runners (Errno 111). Run 30819066222 made 1,122 such attempts for
      # zero successful fetches and spent 196 minutes doing it. The scraper
      # now prefers live PFR and trips a circuit breaker on the archive, but
      # skipping it outright in CI avoids paying even the breaker's warm-up.
      # Unset this to let the archive be tried again (e.g. running locally).
      # Pro Football Reference returns HTTP 403 to GitHub-hosted runners.
      # Our User-Agent is honest and self-identifying, so this is an
      # IP-level block on datacenter ranges, not something to work around -
      # Sports Reference's terms do not permit scraping, and we are not
      # going to spoof a browser to evade a deliberate access control.
      #
      # Run 35597107333 (with the direct-first fix) proved it: 26 x 403
      # from PFR and Errno 111 from the archive, on exactly the marquee
      # players the site most needs - Mahomes, Josh Allen, Lamar, Hurts,
      # Herbert, Lawrence, Bijan, Gibbs, Amon-Ra St. Brown.
      #
      # The per-player Career Stats panel is the only consumer. It is
      # skipped here until it is rebuilt on nflverse data, which we already
      # download in this same job and which is published for exactly this
      # use. The builder already degrades gracefully, so player pages lose
      # one panel and nothing else.
      - name: Run the model end-to-end
        env:
          PFR_DISABLE_WAYBACK: '1'
          DFM_SKIP_CAREER_STATS: '1'
        run: |
          python -m dynasty.launcher_headless

      # Refresh the cross-league manager corpus.
      #
      # A BOUNDED crawl of Sleeper's social graph: Sleeper publishes no way to
      # enumerate leagues, so the only discovery path is league -> members ->
      # their leagues. Caps are explicit and conservative, and the run reports
      # the budget it consumed. Read docs/CROSS-LEAGUE-CORPUS.md before
      # raising any of these numbers -- Sleeper's API is free for
      # NON-COMMERCIAL use only, and the rate guidance is under 1000
      # calls/minute.
      #
      # Runs after the model build so it can overwrite the stale corpus copy
      # that generate_site() published into dynasty_site/ from the committed
      # artifact.
      #
      # continue-on-error: a Sleeper hiccup, a rate limit or a budget
      # exhaustion must never block the deploy. The page degrades to the last
      # committed corpus, or to "nothing indexed yet" if there is none.
      - name: Refresh the cross-league manager corpus
        continue-on-error: true
        run: |
          python scripts/crawl_cross_league.py \
            --max-hops 2 \
            --max-leagues 12 \
            --max-calls 600 \
            --min-delay 0.25 \
            --write-corpus \
            --site-out dynasty_site

      # Retain a compact dated KTC value record.
      #
      # The model build above runs scripts/refresh_ktc_consensus.py, which
      # writes data/consensus/history/ktc_values_YYYY-MM-DD.json (~6 KB). The
      # full dated snapshot written next to it is gitignored and dies with the
      # runner, which is why this project has never retained a single day of
      # KTC price history -- and why the Manager Score page currently has to
      # price eight-month-old trades at today's value and say so on the page.
      #
      # Committing the compact record is what fixes that, one day at a time.
      # It cannot be backfilled, so a skipped day is gone for good; the step
      # is continue-on-error because losing a day must never block the deploy.
      #
      # [skip ci] matters: this workflow triggers on push to main, so without
      # it every commit here would start another full run.
      - name: Retain KTC value history
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/consensus/history 2>/dev/null)" ]; then
            echo "No new KTC value history to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/consensus/history
          git commit -m "chore(ktc): retain dated value snapshot [skip ci]"
          # Another run (or a merge) may have landed first; rebase rather than
          # force anything, and give up quietly if it still will not apply.
          git pull --rebase --autostash origin main || exit 0
          git push origin HEAD:main

      # Retain the cross-league corpus.
      #
      # This is what makes the corpus GROW rather than churn. The site is
      # static on GitHub Pages, so a browser cannot write to the corpus --
      # committing it here is the only persistence mechanism available.
      #
      # Unlike the KTC history above, this CAN be rebuilt from scratch: a lost
      # day just means the next run re-crawls from the seeds. What is lost is
      # accumulated reach -- leagues found on earlier runs that today's budget
      # would not have reached.
      #
      # If this step cannot push (repository Actions permissions set to
      # read-only, branch protection), the feature still works: every run
      # crawls and ranks, and the page says "indexed in this build only"
      # instead of claiming a growing index. That degradation is by design and
      # covered by tests -- see docs/CROSS-LEAGUE-CORPUS.md section 7.
      - name: Retain the cross-league corpus
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain data/cross_league 2>/dev/null)" ]; then
            echo "No cross-league corpus change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cross_league
          git commit -m "chore(crossleague): refresh manager corpus [skip ci]"
          git pull --rebase --autostash origin main || exit 0
          git push origin HEAD:main

      # Must run AFTER the model build: it reads dynasty_site/engine_rankings.json
      # for model ranks and writes dynasty_site/highlights.json alongside it.
      # continue-on-error because a YouTube quota blip must never block the
      # rankings deploy — myteam.html and reel.html degrade to an on-page
      # message when the index is absent.
      - name: Refresh YouTube highlight index
        continue-on-error: true
        env:
          # Falls back to APIGOOGLESAND, the only secret currently on the
          # repo. If that one is actually the Maps key for another project,
          # the YouTube API answers 403, this step logs it and exits without
          # blocking the deploy - so the fallback is safe either way. Add a
          # secret literally named YOUTUBE_API_KEY and it wins automatically.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.APIGOOGLESAND }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY not set - skipping highlights refresh."
            exit 0
          fi
          python scripts/refresh_highlights.py

      - name: Upload site as a GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dynasty_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
